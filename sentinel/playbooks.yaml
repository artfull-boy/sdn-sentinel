# One playbook per attack type the detector can send. Anything else, or
# confidence under 0.6, falls back to "unknown".
# release_after_quiet_s: auto rollback once the score stayed under tau this long.

flood:                        # S4 flood and S6 pulsed flood
  action: meter
  rate_pps: 2
  escalate_to_drop_after_s: 15
  release_after_quiet_s: 30

slow_exhaustion:              # S5
  action: meter
  rate_pps: 2
  release_after_quiet_s: 60

spoofing:                     # S7: drop the victim's MAC on the impostor port only
  action: drop_victim_mac
  release_after_quiet_s: 60

unknown:                      # meter only, a human decides (POST /release)
  action: meter
  rate_pps: 2
  flag_human: true
  release_after_quiet_s: null
