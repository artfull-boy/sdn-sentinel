<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="860" viewBox="0 0 1780 860"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B5BE2"/></marker><marker id="arg" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98A1AE"/></marker></defs><rect width="1780" height="860" fill="#FFFFFF"/><text x="60" y="72" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#16213E" text-anchor="start">Sentinel: a self-defending SDN</text><text x="60" y="110" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#5B6472" text-anchor="start">Learned detection and automatic mitigation on our Lab 1/2 environment (Mininet 2.3, Open vSwitch + OpenFlow 1.3, ONOS 2.7 in Docker)</text><rect x="60" y="300" width="250" height="150" rx="14" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/><text x="185.0" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">Mininet + OVS</text><text x="185.0" y="393.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">3 switches, 6 hosts</text><text x="185.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">attacks run here</text><rect x="420" y="300" width="250" height="150" rx="14" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/><text x="545.0" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">ONOS controller</text><text x="545.0" y="393.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">reactive forwarding (fwd)</text><text x="545.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">REST API, Docker</text><rect x="780" y="300" width="330" height="150" rx="14" fill="#EAF0FD" stroke="#2B5BE2" stroke-width="2"/><text x="945.0" y="353.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">ML detector</text><text x="945.0" y="393.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">polls ONOS every 2 s, 12 features/port</text><text x="945.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">1. Isolation Forest</text><text x="945.0" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">2. Random Forest (type)</text><rect x="1240" y="300" width="250" height="150" rx="14" fill="#EAF0FD" stroke="#2B5BE2" stroke-width="2"/><text x="1365.0" y="361.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">Mitigation engine</text><text x="1365.0" y="393.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">meter or drop rule</text><text x="1365.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">rollback, guardrails</text><line x1="310" y1="375.0" x2="420" y2="375.0" stroke="#2B5BE2" stroke-width="3" marker-end="url(#ar)"/><circle cx="365" cy="375.0" r="17" fill="#2B5BE2"/><text x="365" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="365" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6472" text-anchor="middle">OpenFlow</text><line x1="670" y1="375.0" x2="780" y2="375.0" stroke="#2B5BE2" stroke-width="3" marker-end="url(#ar)"/><circle cx="725" cy="375.0" r="17" fill="#2B5BE2"/><text x="725" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="725" y="349.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6472" text-anchor="middle">REST, 2 s</text><line x1="1110" y1="375.0" x2="1240" y2="375.0" stroke="#2B5BE2" stroke-width="3" marker-end="url(#ar)"/><circle cx="1175" cy="375.0" r="17" fill="#2B5BE2"/><text x="1175" y="381.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="1175" y="341.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6472" text-anchor="middle">alert +</text><text x="1175" y="359.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6472" text-anchor="middle">attack type</text><path d="M1365,300 L1365,180 L545,180 L545,300" fill="none" stroke="#2B5BE2" stroke-width="3" marker-end="url(#ar)"/><circle cx="955" cy="180" r="17" fill="#2B5BE2"/><text x="955" y="186" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="955" y="158" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B5BE2" text-anchor="middle">countermeasure installed through ONOS REST (meter or drop rule), removed after recovery</text><rect x="700" y="620" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/><text x="820.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">Prometheus</text><text x="820.0" y="693.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">stores the metrics</text><rect x="360" y="620" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/><text x="480.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">Grafana</text><text x="480.0" y="693.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">live security dashboard</text><line x1="900" y1="450" x2="860" y2="620" stroke="#98A1AE" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arg)"/><text x="905" y="535.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="start">metrics</text><line x1="1300" y1="450" x2="940" y2="640" stroke="#98A1AE" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arg)"/><text x="1140" y="575" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#5B6472" text-anchor="middle">metrics</text><line x1="700" y1="675" x2="600" y2="675" stroke="#98A1AE" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arg)"/><rect x="1480" y="620" width="230" height="110" rx="14" fill="#FFFFFF" stroke="#98A1AE" stroke-width="2" stroke-dasharray="7 6"/><text x="1595.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#16213E" text-anchor="middle">Google Colab</text><text x="1595.0" y="693.0" font-family="Helvetica, Arial, sans-serif" font-size="16.5" font-weight="normal" fill="#5B6472" text-anchor="middle">offline training</text><path d="M1595,620 L1595,470 L945,470 L945,450" fill="none" stroke="#98A1AE" stroke-width="2.5" stroke-dasharray="7 6"/><text x="1300" y="455" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#5B6472" text-anchor="middle">trained model file</text><rect x="60" y="806" width="26" height="20" rx="5" fill="#EAF0FD" stroke="#2B5BE2" stroke-width="2"/><text x="96" y="823" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#16213E" text-anchor="start">Python services we write</text><line x1="420" y1="816" x2="470" y2="816" stroke="#2B5BE2" stroke-width="3"/><text x="480" y="823" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#16213E" text-anchor="start">detection and response loop, 1 to 4</text><line x1="900" y1="816" x2="950" y2="816" stroke="#98A1AE" stroke-width="2.5" stroke-dasharray="7 6"/><text x="960" y="823" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#16213E" text-anchor="start">monitoring or offline only (not in the decision path)</text></svg>