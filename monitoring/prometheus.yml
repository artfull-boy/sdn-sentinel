global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: collector
    static_configs: [{ targets: ["localhost:9200"] }]
  - job_name: detector
    static_configs: [{ targets: ["localhost:9201"] }]
  - job_name: engine
    static_configs: [{ targets: ["localhost:9202"] }]

rule_files:
  - /etc/prometheus/rules.yml
