services:
  onos:
    image: onosproject/onos:2.7.0
    container_name: onos
    environment:
      - ONOS_APPS=gui2,drivers,openflow,fwd
    ports:
      - "127.0.0.1:8181:8181"   # GUI/REST, localhost only (Lab 2 hardening)
      - "127.0.0.1:8101:8101"   # Karaf SSH, localhost only
      - "127.0.0.1:6653:6653"   # OpenFlow, only the local Mininet switches need it

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_HTTP_ADDR=127.0.0.1
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
